
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b14">

    <title>AmeerAppStore</title>
    <meta name="google-site-verification" content="u7CSEpmlzfuw6Bax87YUSAAnGERNL--ViufCXGltduQ" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b14;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 24px 22px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #648cff;
        }

        .version-badge {
            background: #17243a;
            color: #8eaeff;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .section-title {
            font-size: 12px;
            color: #648cff;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .app-count {
            color: #9ba8bd;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .app-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 13px;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #121827;
            border: 1px solid #202b40;
            padding: 14px;
            border-radius: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .app-card:active {
            transform: scale(0.97);
            background: #1b2537;
        }

        .app-icon {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 14px;
            background: #1b2537;
            flex-shrink: 0;
        }

        .app-details {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .app-description {
            font-size: 12px;
            color: #9ba8bd;
            line-height: 1.4;
            margin-bottom: 7px;
        }

        .app-version {
            color: #648cff;
            font-size: 10px;
        }

        .open-icon {
            color: #648cff;
            font-size: 22px;
        }

        .empty-message {
            text-align: center;
            color: #8290a7;
            padding: 35px 10px;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: #566176;
            font-size: 10px;
            margin-top: 45px;
        }

        @media (max-height: 600px) {
            .app {
                padding-top: 16px;
            }

            header {
                margin-bottom: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <header>
            <div class="logo">
                Ameer<span>AppStore</span>
            </div>

            <div class="version-badge">
                STORE v1.0
            </div>
        </header>

        <main>

            <div class="section-title">
                APPLICATION LIBRARY
            </div>

            <div class="app-count" id="appCount">
                Loading applications...
            </div>

            <div class="app-list" id="appList"></div>

        </main>

        <footer>
            © 2026 AMEERAPPSTORE. ALL RIGHTS RESERVED.
            THIS WEBSITE IS FOR ANDROID SCREEN ONLY CAN SUPPORT POTRAIT.
        </footer>

    </div>

    <script src="./main.js"></script>

</body>
</html>
